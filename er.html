<meta charset="utf-8">
<title>Entity&ndash;relationship diagram &mdash; Essay 5</title>
<style>
  /* Dark is the unconditional default -- not gated behind
     prefers-color-scheme, since some browsers/environments (e.g. Safari on
     macOS set to Light appearance) would otherwise silently fall back to
     a very different-looking light theme instead of matching what every
     other view of this page shows. */
  :root{
    color-scheme: dark;
    --surface-1:      #000000;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --rule:           #3a3934;
    --ms:             #4b99f7;
    --dharma:         #eb6b38;
    --case:           #f1f0eb;
    --nomenclature:   #db9712;
    --sphere:         #129512;
    --avacara:        #e76393;
    --qualtier:       #a297fb;
    --content:        #f87979;
    --caseattr:       #34e5ff;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --rule:           #dcdad2;
    --ms:             #2a78d6;
    --dharma:         #eb6834;
    --case:           #22201a;
    --nomenclature:   #eda100;
    --sphere:         #008300;
    --avacara:        #e87ba4;
    --qualtier:       #4a3aa7;
    --content:        #e34948;
    --caseattr:       #0891b2;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--surface-1);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:.9rem 1.2rem;
    border-bottom:1px solid var(--rule);
    flex:0 0 auto;
  }
  header h1{
    font-size:1rem;
    font-weight:650;
    margin:0 0 .2rem;
  }
  header p{
    margin:0;
    font-size:.85rem;
    color:var(--text-secondary);
  }
  header a{ color:inherit; }
  #erWrap{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    place-items:center;
    padding:1.2rem;
  }
  #erSvg{
    display:block;
    width:100%;
    height:100%;
    max-width:min(1400px, calc(96vh * 900 / 750));
    max-height:96vh;
  }
  #erSvg .er-bg{ fill:none; }
  #erSvg .er-box{ fill:var(--surface-1); stroke:#8a8a8a; stroke-width:1.4px; }
  :root[data-theme="light"] #erSvg .er-box{ fill:#f1f0eb; }
  #erSvg .er-line{ stroke:#8a8a8a; stroke-width:1.2px; fill:none; }
  #erSvg .er-label{ font-size:11px; font-weight:650; fill:var(--text-primary); }
  #erSvg .er-count{ font-size:9.5px; fill:var(--text-secondary); }
  #erSvg .er-mark{ stroke:#8a8a8a; stroke-width:2px; fill:none; }
  /* Self-relations: a dharma cites an earlier dharma, an MS derives from an
     earlier MS. Drawn as a loop off the box's right edge, captioned because a
     self-loop's meaning is not readable from crow's feet alone. */
  #erSvg .er-selfloop{ stroke:#8a8a8a; stroke-width:1.2px; fill:none; }
  #erSvg .er-rel{ font-size:9px; fill:var(--text-secondary); font-style:italic; }
  #erSvg .er-swatch{ stroke:none; }
</style>
<header>
  <h1>Rise of thought in the <em>Dhammasangani</em> &mdash; entity&ndash;relationship diagram</h1>
  <p>Structure of the underlying data. See <a href="index.html">index.html</a> for the interactive network diagram.</p>
</header>
<div id="erWrap">
  <svg id="erSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750"></svg>
</div>
<script src="graph-data.js"></script>
<script>
(async function(){
  let data, erSvgMarkup;
  try {
    const [gd, svgText] = await Promise.all([
      loadGraphData(),
      fetch('er.svg').then(r => r.text())
    ]);
    data = gd.data;
    erSvgMarkup = svgText;
  } catch (err) {
    document.getElementById('erWrap').innerHTML =
      '<p style="color:var(--text-secondary)"><b>Could not load the source tables.</b><br>' +
      String(err.message || err) + '<br>Serve this over HTTP (e.g. ' +
      '<code>python3 -m http.server</code>) &mdash; fetch() is blocked on file:// URLs.</p>';
    throw err;
  }
  document.getElementById('erSvg').innerHTML = erSvgMarkup;

  const erCounts = {
    'count-ms-er-ms': data.ms.length,
    'count-ms-er-dharma': data.dharmas.length,
    'count-ms-er-case': data.cases.length,
    'count-ms-er-nomenclature': data.nomenclature.length,
    'count-ms-er-sphere': data.spheres.length,
    'count-ms-er-avacara': data.avacaras.length,
    'count-ms-er-qualdharma': data.quality_dharma.length,
    'count-ms-er-content': data.content.length,
    'count-ms-er-trancic': data.trancic.length,
    'count-ms-er-mental': data.mental.length,
    'count-ms-er-senseobj': data.sense_objects.length,
    'count-ms-er-dhyanicobj': data.dhyanic_objects.length,
  };
  for(const id in erCounts){
    const el = document.getElementById(id);
    if(el) el.textContent = `${erCounts[id]} rows`;
  }
})();
</script>
