<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>III-VIII, XI-XIV</title>
<style>
  /* Dark is the unconditional default -- not gated behind
     prefers-color-scheme, since some browsers/environments (e.g. Safari on
     macOS set to Light appearance) would otherwise silently fall back to
     a very different-looking light theme instead of matching what every
     other view of this page shows. */
  .viz-root{
    color-scheme: dark;
    --surface-1:      #000000;
    --surface-2:      #121212;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8f8d82;
    --rule:           #3a3934;
    --ms:             #4b99f7;
    --dharma:         #eb6b38;
    --tablevii:       #2bb082;
    --case:           #f1f0eb;
    --case-stub:      #5c5a52;
    --nomenclature:   #db9712;
    --sphere:         #129512;
    --avacara:        #e76393;
    --qualtier:       #a297fb;
    --content:        #f87979;
    --caseattr:       #34e5ff;
    --derivation:     #7fd4ff;
    --homonym:        #e8b339;
    --synonym:        #e05fd0;
    --isotope:        #4dd9e8;
    --highlight:      #a297fb;
    --quality-a:      #1eb51e;
    --quality-b:      #f87979;
    --quality-c:      #8f8d82;
  }
  :root[data-theme="light"] .viz-root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f1f0eb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #8a887f;
    --rule:           #dcdad2;
    --ms:             #2a78d6;
    --dharma:         #eb6834;
    --tablevii:       #1baf7a;
    --case:           #22201a;
    --case-stub:      #b6b3a8;
    --nomenclature:   #eda100;
    --sphere:         #008300;
    --avacara:        #e87ba4;
    --qualtier:       #4a3aa7;
    --content:        #e34948;
    --caseattr:       #0891b2;
    --derivation:     #0a6fa8;
    --homonym:        #a67c00;
    --synonym:        #a6299d;
    --isotope:        #0e7f8c;
    --highlight:      #4a3aa7;
    --quality-a:      #0ca30c;
    --quality-b:      #d03b3b;
    --quality-c:      #8a887f;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;}
  .viz-root{
    background:var(--surface-1);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    height:100vh;
    width:100vw;
    overflow:hidden;
    position:relative;
  }
  .stage{
    position:absolute;
    inset:0;
    overflow:hidden;
    cursor:grab;
  }
  #sidebarToggle{
    position:absolute;
    top:.8rem;
    right:.8rem;
    z-index:21;
    width:34px; height:34px;
    border-radius:7px;
    background:var(--surface-2);
    border:1px solid var(--rule);
    color:var(--text-primary);
    cursor:pointer;
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #sidebarToggle:hover{ background:var(--rule); }
  #sidebar{
    position:absolute;
    top:0; right:0; bottom:0;
    width:min(340px, 88vw);
    background:var(--surface-2);
    border-left:1px solid var(--rule);
    box-shadow:-6px 0 24px rgba(0,0,0,.18);
    z-index:20;
    padding:3.2rem 1.1rem 1.1rem;
    overflow-y:auto;
    transition:transform .22s ease;
    transform:translateX(0);
  }
  #sidebar.collapsed{ transform:translateX(100%); }
  #sidebar p.desc{
    margin:0 0 1rem;
    font-size:.78rem;
    color:var(--text-secondary);
    line-height:1.45;
  }
  .toolbar{
    display:flex; flex-direction:column; gap:.5rem;
    margin-bottom:.7rem;
  }
  .toolbar input{
    background:var(--surface-1);
    border:1px solid var(--rule);
    color:var(--text-primary);
    border-radius:5px;
    padding:.4rem .6rem;
    font-size:.78rem;
    width:100%;
  }
  .toolbar button{
    background:var(--surface-1);
    border:1px solid var(--rule);
    color:var(--text-primary);
    border-radius:5px;
    padding:.4rem .6rem;
    font-size:.78rem;
    cursor:pointer;
    width:100%;
  }
  .toolbar button:hover{ background:var(--rule); }
  .search-row{ display:flex; gap:.4rem; }
  .search-row input{ flex:1 1 auto; min-width:0; width:auto; }
  .search-row button{ flex:0 0 auto; width:auto; padding:.4rem .55rem; }
  .edge-filters{ display:flex; gap:.9rem; font-size:.8rem; color:var(--text-secondary); }
  .edge-filters label{ display:flex; align-items:center; gap:.3rem; cursor:pointer; }
  .edge-filters input{ width:auto; margin:0; }
  /* The ER diagram sits directly in the sidebar now, in the legend's old
     spot -- a fixed-height box (rather than "grow to fill") so it doesn't
     crowd out the search/reset toolbar above it. */
  #erInline{
    width:100%;
    height:min(60vh, 420px);
    border:1px solid #4a4a4a;
    border-radius:8px;
    background:#000000;
    overflow:hidden;
    margin-bottom:1.1rem;
  }
  #erSvg{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #erSvg.grabbing{ cursor:grabbing; }
  #erSvg .er-bg{ fill:#000000; }
  #erSvg .er-box{ fill:#1c1c1c; stroke:#4a4a4a; stroke-width:1.4px; }
  #erSvg .er-line{ stroke:#8a8a8a; stroke-width:1.2px; fill:none; }
  #erSvg .er-label{ font-size:11px; font-weight:650; fill:#f5f5f5; }
  #erSvg .er-count{ font-size:9.5px; fill:#a8a8a8; }
  #erSvg .er-mark{ stroke:#8a8a8a; stroke-width:2px; fill:none; }
  /* Self-relations: a dharma cites an earlier dharma, an MS derives from an
     earlier MS. Drawn as a loop off the box's right edge, captioned because a
     self-loop's meaning is not readable from crow's feet alone. */
  #erSvg .er-selfloop{ stroke:#8a8a8a; stroke-width:1.2px; fill:none; }
  #erSvg .er-rel{ font-size:9px; fill:#a8a8a8; font-style:italic; }
  #erSvg .er-swatch{ stroke:none; }
  #erSvg .er-node{ cursor:pointer; }
  #erSvg .er-node .er-box{ transition:fill .12s, stroke .12s; }
  #erSvg .er-node:hover .er-box, #erSvg .er-node:focus-visible .er-box{ fill:#2a2a2a; stroke:#8a8a8a; }
  #erSvg .er-node:focus-visible{ outline:none; }
  .stage.grabbing{ cursor:grabbing; }
  svg#canvas{ position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none; }
  .node-case circle{ fill:var(--case); }
  .node-case.stub circle{ fill:var(--case-stub); }
  .node-dharma circle{ fill:var(--dharma); }
  .node-ms circle{ fill:var(--ms); }
  .node-nomenclature circle{ fill:var(--nomenclature); }
  .node-sphere circle{ fill:var(--sphere); }
  .node-avacara circle{ fill:var(--avacara); }
  .node-qualtier circle{ fill:var(--qualtier); }
  .node-content circle{ fill:var(--content); }
  .node-caseattr circle{ fill:var(--caseattr); }
  .node{ cursor:pointer; }
  .node circle{ stroke:var(--surface-1); stroke-width:1px; transition:opacity .15s; }
  .node.dim circle{ opacity:.14; }
  .node.dim text{ opacity:.1; }
  .node.active circle{ stroke:var(--highlight); stroke-width:2.4px; }
  .qring{ fill:none; stroke-width:1.6px; }
  .label{
    font-size:9px;
    fill:var(--text-secondary);
    pointer-events:none;
    transition:opacity .15s;
  }
  .label.ms-no{ font-size:6px; }
  /* Deliberately not transitioned, unlike .node/.label above: there are ~3.6k
     edge paths, and highlighting toggles .hl across all of them at once. A
     transition here means thousands of concurrent animations on stroke and
     opacity -- SVG paint properties the browser animates on the main thread,
     not the compositor -- which stalls the frame on every click. The ~900
     nodes and labels are few enough to still afford theirs. */
  .edge{ stroke:var(--text-secondary); fill:none; }
  .edge.ms-dharma{ stroke-width:.8px; opacity:.4; }
  /* The two same-row relations: MS derived from an earlier MS, and a dharma
     declared "as in" an earlier dharma. Both bow into an arc along their own row,
     and share a hue that no cross-row edge uses -- that, plus the arc shape, is
     what tells them apart from the lines leaving the row. */
  .edge.ms-derivation{ stroke-width:1.1px; opacity:.75; stroke:var(--derivation); fill:none; }
  /* A content variant "derived from" its parent (e.g. 2d from 2) -- same
     same-row arc and hue as ms-derivation above; the two never share a row
     so the shared colour causes no ambiguity. */
  .edge.content-derivation{ stroke-width:1.1px; opacity:.75; stroke:var(--derivation); fill:none; }
  /* Dharma-to-dharma relations from tables XI/XII/XIII (homonym/synonym/isotope
     groups, alpha/beta/gamma). Same-row arcs like ms-derivation above, each in
     its own hue so the three relations stay distinguishable where they overlap. */
  .edge.dharma-homonym{ stroke-width:1px; opacity:.55; stroke:var(--homonym); fill:none; }
  .edge.dharma-synonym{ stroke-width:1px; opacity:.55; stroke:var(--synonym); fill:none; }
  .edge.dharma-isotope{ stroke-width:1px; opacity:.55; stroke:var(--isotope); fill:none; }
  /* A dharma declared "as in" an earlier one (table VI). Shares ms-derivation's
     hue: both are a later entry pointing back to an earlier one it's identical
     to / derived from, and the two never share a row. */
  .edge.dharma-as-in{ stroke-width:1px; opacity:.55; stroke:var(--derivation); fill:none; }
  /* Hidden by default behind the sidebar's alpha/beta/gamma/as-in checkboxes:
     these relations are dense enough to clutter the DHARMAS row when all on. */
  .edge.dharma-homonym, .edge.dharma-synonym, .edge.dharma-isotope, .edge.dharma-as-in{ display:none; }
  .edge.dharma-homonym.shown{ display:inline; }
  .edge.dharma-synonym.shown{ display:inline; }
  .edge.dharma-isotope.shown{ display:inline; }
  .edge.dharma-as-in.shown{ display:inline; }
  .edge.dharma-case{ stroke-width:1px; opacity:.5; }
  /* The same case-dharma relation, but stated by VII rather than VI.
     Solid like its VI counterpart, distinguished by colour. There are ~4x
     as many of these, so the opacity is pulled back a little. */
  .edge.dharma-case-vii{ stroke-width:1px; opacity:.32; stroke:var(--tablevii); }
  .edge.nom-case{ stroke-width:.8px; opacity:.28; stroke:var(--nomenclature); }
  .edge.sphere-case{ stroke-width:.8px; opacity:.28; stroke:var(--sphere); }
  .edge.av-sphere{ stroke-width:1.2px; opacity:.5; stroke:var(--avacara); }
  .edge.q-sphere{ stroke-width:1.2px; opacity:.5; stroke:var(--qualtier); }
  .edge.content-case{ stroke-width:.8px; opacity:.28; stroke:var(--content); }
  .edge.caseattr-case{ stroke-width:.8px; opacity:.28; stroke:var(--caseattr); }
  .edge.hl{ stroke:var(--highlight) !important; opacity:1 !important; stroke-width:2px !important; }
  .row-label{
    font-size:10.5px;
    font-weight:650;
    fill:var(--text-muted);
    letter-spacing:.04em;
  }
  #tooltip{
    position:fixed;
    pointer-events:none;
    background:var(--surface-2);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:.5rem .65rem;
    font-size:.74rem;
    line-height:1.45;
    max-width:320px;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    display:none;
    z-index:10;
  }
  #tooltip b{ color:var(--text-primary); }
  #tooltip .muted{ color:var(--text-muted); }
  /* Pinned by a click rather than hover: stays open past mouseleave, so it
     needs its own close affordance and has to accept pointer events to be
     clickable (a hovering tooltip stays click-through). */
  #tooltip.pinned{ pointer-events:auto; padding-right:1.5rem; }
  #tooltip .tt-close{
    position:absolute; top:.25rem; right:.4rem;
    cursor:pointer; color:var(--text-muted); font-size:1rem; line-height:1;
    padding:.05rem .25rem;
  }
  #tooltip .tt-close:hover{ color:var(--text-primary); }
  /* No underline: the hover colour change already marks these as clickable,
     and a dotted underline under IDs and the "III, ..." case-ref lines made
     the popup harder to read than it needed to be. */
  #tooltip .tt-link{ cursor:pointer; }
  #tooltip .tt-link:hover{ color:var(--highlight); }
  #tooltip .tt-nav{
    display:flex;
    justify-content:center;
    gap:2px;
    margin-top:.5rem;
  }
  #tooltip .tt-dir{
    display:flex; align-items:center; justify-content:center;
    width:1.5rem; height:1.5rem;
    background:var(--surface-1);
    border:1px solid var(--rule);
    border-radius:4px;
    color:var(--text-primary);
    font-size:.7rem;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  #tooltip .tt-dir:hover{ background:var(--rule); }
  #tooltip .tt-dir:disabled{ opacity:.25; cursor:default; }
  #tooltip .tt-dir:disabled:hover{ background:var(--surface-1); }
  #zoomctrl{
    position:absolute; top:.8rem; left:.8rem;
    display:flex; gap:.3rem;
    z-index:15;
  }
  #zoomctrl button{
    width:26px;height:26px;border-radius:5px;
    background:var(--surface-2); border:1px solid var(--rule); color:var(--text-primary);
    cursor:pointer; font-size:.9rem;
  }
  #zoomctrl button[aria-pressed="true"]{
    background:var(--highlight); color:var(--surface-1);
  }
  #soundToggle, #soundToggle[aria-pressed="true"]{ display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--text-primary); }
  #soundToggle svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #soundToggle .snd-waves, #soundToggle .snd-mute{ display:none; }
  #soundToggle[aria-pressed="true"] .snd-waves{ display:inline; }
  #soundToggle[aria-pressed="false"] .snd-mute{ display:inline; }
</style>

    <p class="desc">Tables III&ndash;VIII, XI&ndash;XIV of Essay 5, &ldquo;Rise of Thought as
Phenomenon and System,&rdquo; in Alexander Piatigorsky's <em>The Buddhist
Philosophy of Thought: Essays in Interpretation</em>, (London: Curzon Press, 1984), pp. 92 to 145, 165 to 167.</p>
    <div id="erInline">
      <svg id="erSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 688"></svg>
    </div>

        <label title="Homonyms (XI)"><input type="checkbox" id="toggleHomonym">&alpha;</label>
        <label title="Synonyms (XII)"><input type="checkbox" id="toggleSynonym">&beta;</label>
        <label title="Isotopes (XIII)"><input type="checkbox" id="toggleIsotope">&gamma;</label>
        <label title="As in (VI)"><input type="checkbox" id="toggleAsIn">as in</label>
      </div>

<script src="graph-data.js"></script>
<script>

(async function(){
  let data, warn, F, erSvgMarkup;
  try {
    const [gd, svgText] = await Promise.all([
      loadGraphData(),
      fetch('er-mini.svg').then(r => r.text())
    ]);
    ({data, warn, F} = gd);
    erSvgMarkup = svgText;
  } catch (err) {
    document.getElementById('tooltip').innerHTML =
      '<b>Could not load the source tables.</b><br>' + String(err.message || err) +
      '<br>Serve this over HTTP (e.g. <code>python3 -m http.server</code>) &mdash; ' +
      'fetch() is blocked on file:// URLs.';
    document.getElementById('tooltip').style.display = 'block';
    throw err;
  }
  // Anything the source notation did not parse cleanly: surfaced rather than
  // silently dropped, since a missed token means missing nodes or edges.
  for(const w of warn) console.warn('graph data:', w);

  const svg = document.getElementById('canvas');
  const viewport = document.getElementById('viewport');
  const stage = document.getElementById('stage');
  const tooltip = document.getElementById('tooltip');
  const NS = 'http://www.w3.org/2000/svg';

  // ---------- sort helpers ----------
  function sortKey(idStr){
    const m = String(idStr).match(/^(\d+)([a-zA-Z]*)$/);
    if(!m) return [1e9, String(idStr)];
    return [parseInt(m[1],10), m[2]];
  }
  function cmpKey(a,b){
    if(a[0]!==b[0]) return a[0]-b[0];
    return a[1]<b[1] ? -1 : a[1]>b[1] ? 1 : 0;
  }

  // ---------- index ----------
  const caseById = new Map(data.cases.map(c=>[c.case_id, c]));
  const dharmaById = new Map(data.dharmas.map(d=>[d.dharma_id, d]));
  const msById = new Map(data.ms.map(m=>[m.id, m]));
  const supersetById = new Map(data.supersets.map(s=>[s.label, s]));
  const nomenclatureById = new Map(data.nomenclature.map(n=>[n.term_id, n]));
  const sphereById = new Map(data.spheres.map(s=>[s.sphere_id, s]));
  const avacaraById = new Map(data.avacaras.map(a=>[a.key, a]));
  const qualDharmaById = new Map(data.quality_dharma.map(q=>[q.letter, q]));
  const contentDefs = data.content_defs;
  const contentFootnoteSet = new Set(data.content_footnotes.map(f=>f.case_id+'|'+f.content_id));
  const contentById = new Map(data.content.map(c=>[c.content_id, c]));
  const trancicById = new Map(data.trancic.map(t=>[t.trancic_id, t]));
  const mentalById = new Map(data.mental.map(m=>[m.mental_id, m]));
  const senseObjById = new Map(data.sense_objects.map(o=>[o.object_id, o]));
  const dhyanicObjById = new Map(data.dhyanic_objects.map(o=>[o.object_id, o]));
  const thoughtById = new Map(data.thought.map(t=>[t.thought_id, t]));
  const sphereThoughtById = new Map(data.sphere_thought.map(t=>[t.sphere_thought_id, t]));

  const dharmasByCase = new Map();
  for(const d of data.dharmas){
    if(!dharmasByCase.has(d.owner_case)) dharmasByCase.set(d.owner_case, []);
    dharmasByCase.get(d.owner_case).push(d);
  }
  for(const arr of dharmasByCase.values()) arr.sort((a,b)=>cmpKey(sortKey(a.dharma_id), sortKey(b.dharma_id)));

  // Reverse of ms.derived_from, so an MS can name its derivatives as well as
  // its parent (MS 93 lists 113; MS 97 lists 122).
  const homonymByDharma = new Map(Object.entries(data.homonyms_by_dharma || {}));
  const synonymByDharma = new Map(Object.entries(data.synonyms_by_dharma || {}));
  const isotopeByDharma = new Map(Object.entries(data.isotopes_by_dharma || {}));
  const xivByDharma = new Map(Object.entries(data.xiv_by_dharma || {}));
  const xivSign = s => s==='-' ? `<span style="color:var(--quality-a)">&minus;</span>`
    : s==='+' ? `<span style="color:var(--quality-b)">+</span>` : esc(s);

  const msDerivedFrom = new Map();
  for(const m of data.ms){
    if(m.derived_from == null) continue;
    if(!msDerivedFrom.has(m.derived_from)) msDerivedFrom.set(m.derived_from, []);
    msDerivedFrom.get(m.derived_from).push(m);
  }

  const msByDharma = new Map();
  for(const m of data.ms){
    if(!msByDharma.has(m.owner_dharma)) msByDharma.set(m.owner_dharma, []);
    msByDharma.get(m.owner_dharma).push(m);
  }

  const caseOrder = data.cases.slice().sort((a,b)=>cmpKey(sortKey(a.case_id), sortKey(b.case_id)));

  // ---------- layout ----------
  const W_MS = 10, W_MIN_DHARMA = 26, GAP_DHARMA = 6, W_MIN_CASE = 22, GAP_CASE = 10;
  // Six levels, each LAYER_GAP apart, most general at the top:
  //   1  avacara, character of dharmas   (what a sphere is made of)
  //   2  nomenclature of thought
  //   2b sphere of thought               (own row, nudged below nomenclature)
  //   3  the V dimension tables    (content, trancic, objects, mental)
  //   4  cases
  //   5  dharmas
  //   6  mental states
  // Levels 1-3 hold few nodes each, so they are laid out as horizontal
  // segments of a shared line rather than aligned to the case columns below.
  const LAYER_GAP = 640;
  // Level 1 sits half a gap above level 2 rather than a full one: those two rows
  // are the axes a sphere combines, so they belong closer together than the steps
  // further down, which cross between different kinds of entity.
  const L1_L2_GAP = LAYER_GAP / 2;
  const Y_L2 = 20 + L1_L2_GAP;
  // Level 1 and sphere of thought straddle level 2 symmetrically, each
  // L1_SPHERE_GAP from it -- a quarter closer than L1_L2_GAP, the half-gap
  // that separates level 2 from level 3 below.
  const L1_SPHERE_GAP = L1_L2_GAP * 0.75;
  const Y_L1 = Y_L2 - L1_SPHERE_GAP;
  const Y_SPHERE = Y_L2 + L1_SPHERE_GAP;
  const Y_L3 = Y_L2 + LAYER_GAP;
  const Y_CASE = Y_L3 + LAYER_GAP;
  const Y_DHARMA = Y_CASE + LAYER_GAP;
  const Y_MS = Y_DHARMA + LAYER_GAP;
  let cursor = 0;
  const dharmaLayout = new Map();
  const caseLayout = new Map();
  const msLayout = new Map();

  for(const c of caseOrder){
    const dharmas = dharmasByCase.get(c.case_id) || [];
    if(dharmas.length === 0){
      const w = W_MIN_CASE;
      caseLayout.set(c.case_id, {x: cursor + w/2, width: w});
      cursor += w + GAP_CASE;
      continue;
    }
    const caseStart = cursor;
    for(const d of dharmas){
      const msList = msByDharma.get(d.dharma_id) || [];
      const dw = Math.max(W_MIN_DHARMA, msList.length * W_MS);
      const dStart = cursor;
      if(msList.length > 0){
        let mc = dStart;
        for(const m of msList){
          msLayout.set(m.id, {x: mc + W_MS/2});
          mc += W_MS;
        }
      }
      dharmaLayout.set(d.dharma_id, {x: dStart + dw/2, width: dw});
      cursor += dw + GAP_DHARMA;
    }
    cursor -= GAP_DHARMA;
    const caseEnd = cursor;
    caseLayout.set(c.case_id, {x: (caseStart+caseEnd)/2, width: caseEnd-caseStart});
    cursor += GAP_CASE;
  }
  const totalWidth = cursor;

  // small upper tiers: laid out as horizontal segments of shared rows
  // (independent of case x-alignment — curved edges carry the real
  // connectivity on click). Each segment is [xStart,xEnd] as a fraction of
  // totalWidth, left to right in reading order.
  function rowSegment(list, idKey, y, xStart, xEnd){
    const m = new Map();
    const n = list.length;
    list.forEach((item,i)=> m.set(item[idKey], {x: xStart + (xEnd-xStart)*(n<=1?0.5:(i+0.5)/n), y}));
    return m;
  }
  const seg = (a,b) => [totalWidth*a, totalWidth*b];

  // Level 2 comes first: level 1 is positioned relative to the sphere block.
  // Level 2: sphere of thought | nomenclature of thought -- same left-to-right
  // order as the ER diagram.
  const [SPHERE_X0, SPHERE_X1] = seg(0.06, 0.46);
  const [NOM_X0, NOM_X1] = seg(0.56, 0.88);
  const sphereX = rowSegment(data.spheres, 'sphere_id', Y_SPHERE, SPHERE_X0, SPHERE_X1);
  const nomenclatureX = rowSegment(data.nomenclature, 'term_id', Y_L2, NOM_X0, NOM_X1);

  // Level 1: character of dharmas | avacara — the two axes a sphere combines,
  // sized and placed as one block centred over the sphere dots below rather
  // than given an arbitrary share of the width.
  //
  // rowSegment spreads n dots evenly across its segment, putting dot i at
  // xStart + width*(i+0.5)/n. So to get an exact step and a chosen first dot,
  // the segment must be n*step wide and start half a step early -- that is what
  // the two [X0,X1] pairs below work out, instead of guessing at fractions.
  const SPHERE_STEP  = (SPHERE_X1 - SPHERE_X0) / data.spheres.length;
  const SPHERE_FIRST = SPHERE_X0 + SPHERE_STEP/2;   // centre of the first dot
  const SPHERE_LAST  = SPHERE_X1 - SPHERE_STEP/2;   // centre of the last dot
  const QD_STEP = SPHERE_STEP;           // character of dharmas: match level 2
  const AV_STEP = SPHERE_STEP * 1.25;    // avacara: a little wider
  const nQD = data.quality_dharma.length, nAV = data.avacaras.length;
  // The block's right end is anchored to the sphere row's: the last avacara dot
  // sits a half step inside the last sphere. The character group starts one own
  // width in from the first sphere -- i.e. its first dot sits where its last dot
  // would if it were flush left. The gap between the groups is whatever slack is
  // left over, so it stays consistent if either group changes size.
  const QD_FIRST = SPHERE_FIRST + (nQD - 1)*QD_STEP;
  const AV_LAST  = SPHERE_LAST - SPHERE_STEP*0.5;
  const L1_GAP   = (AV_LAST - QD_FIRST) - (nQD - 1)*QD_STEP - (nAV - 1)*AV_STEP;
  const AV_FIRST = QD_FIRST + (nQD - 1)*QD_STEP + L1_GAP;
  const QD_X0 = QD_FIRST - QD_STEP/2,      QD_X1 = QD_X0 + nQD*QD_STEP;
  const AVACARA_X0 = AV_FIRST - AV_STEP/2, AVACARA_X1 = AVACARA_X0 + nAV*AV_STEP;
  const qualDharmaX = rowSegment(data.quality_dharma, 'letter', Y_L1, QD_X0, QD_X1);
  const avacaraX = rowSegment(data.avacaras, 'key', Y_L1, AVACARA_X0, AVACARA_X1);

  // Level 3: the V dimension tables, spread across the full width in
  // reading order and roughly in proportion to how many entries each holds.
  const [CONTENT_X0, CONTENT_X1] = seg(0.02, 0.30);
  const [TRANCIC_X0, TRANCIC_X1] = seg(0.34, 0.50);
  const [SENSEOBJ_X0, SENSEOBJ_X1] = seg(0.53, 0.60);
  const [DHYANICOBJ_X0, DHYANICOBJ_X1] = seg(0.63, 0.79);
  const [MENTAL_X0, MENTAL_X1] = seg(0.82, 0.98);
  const contentX = rowSegment(data.content, 'content_id', Y_L3, CONTENT_X0, CONTENT_X1);
  const trancicX = rowSegment(data.trancic, 'trancic_id', Y_L3, TRANCIC_X0, TRANCIC_X1);
  const senseObjX = rowSegment(data.sense_objects, 'object_id', Y_L3, SENSEOBJ_X0, SENSEOBJ_X1);
  const dhyanicObjX = rowSegment(data.dhyanic_objects, 'object_id', Y_L3, DHYANICOBJ_X0, DHYANICOBJ_X1);
  const mentalX = rowSegment(data.mental, 'mental_id', Y_L3, MENTAL_X0, MENTAL_X1);

  // ---------- build adjacency for highlighting ----------
  const dharmaToCase = new Map(data.dharma_case_edges.map(e=>[e.from.replace('dh-',''), e.to.replace('case-','')]));
  const msToDharmas = new Map();
  for(const e of data.ms_edges){
    const msId = e.from, dId = e.to.replace('dh-','');
    if(!msToDharmas.has(msId)) msToDharmas.set(msId, []);
    msToDharmas.get(msId).push(dId);
  }
  const dharmaToMs = new Map();
  for(const e of data.ms_edges){
    const msId = e.from, dId = e.to.replace('dh-','');
    if(!dharmaToMs.has(dId)) dharmaToMs.set(dId, []);
    dharmaToMs.get(dId).push(msId);
  }
  // Dharma sets (VI) and supersets (VII) are both sets of
  // *dharmas*, so they have no direct relation to a mental state -- an MS
  // reaches them only through the dharma that holds it. No MS-to-set edges are
  // drawn; these maps exist purely so tooltips can report the reachable MS
  // count and hover can highlight them, and are composed through dharmaToMs
  // rather than stored as a relation of their own.
  function reachMs(dharmaIds){
    const out = new Set();
    for(const dId of dharmaIds) for(const mId of (dharmaToMs.get(dId) || [])) out.add(mId);
    return [...out];
  }
  function invert(fwd){
    const back = new Map();
    for(const [key, msIds] of fwd) for(const mId of msIds){
      if(!back.has(mId)) back.set(mId, []);
      back.get(mId).push(key);
    }
    return back;
  }

  const supersetDharmas = new Map();
  for(const e of data.superset_dharma_edges){
    const supId = e.from.replace('sup-','');
    if(!supersetDharmas.has(supId)) supersetDharmas.set(supId, []);
    supersetDharmas.get(supId).push(e.to.replace('dh-',''));
  }
  const supersetToMs = new Map(
    [...supersetDharmas].map(([supId, dIds]) => [supId, reachMs(dIds)])
  );
  const msToSupersets = invert(supersetToMs);
  const caseToDharmas = new Map();
  for(const [dId, cId] of dharmaToCase){
    if(!caseToDharmas.has(cId)) caseToDharmas.set(cId, []);
    caseToDharmas.get(cId).push(dId);
  }
  const supersetToCase = new Map(data.superset_case_edges.map(e=>[e.from.replace('sup-',''), e.to.replace('case-','')]));
  const caseToSupersets = new Map();
  for(const [sId, cId] of supersetToCase){
    if(!caseToSupersets.has(cId)) caseToSupersets.set(cId, []);
    caseToSupersets.get(cId).push(sId);
  }
  const supersetToDharmas = new Map();
  for(const e of data.superset_dharma_edges){
    const sId = e.from.replace('sup-',''), dId = e.to.replace('dh-','');
    if(!supersetToDharmas.has(sId)) supersetToDharmas.set(sId, []);
    supersetToDharmas.get(sId).push(dId);
  }
  const dharmaToSupersets = new Map();
  for(const [sId, dIds] of supersetToDharmas){
    for(const dId of dIds){
      if(!dharmaToSupersets.has(dId)) dharmaToSupersets.set(dId, []);
      dharmaToSupersets.get(dId).push(sId);
    }
  }

  const caseToNomenclature = new Map();
  const nomenclatureToCases = new Map();
  for(const e of data.nomenclature_case_edges){
    const nid = e.from.replace('nom-',''), cid = e.to.replace('case-','');
    if(!caseToNomenclature.has(cid)) caseToNomenclature.set(cid, []);
    caseToNomenclature.get(cid).push(nid);
    if(!nomenclatureToCases.has(nid)) nomenclatureToCases.set(nid, []);
    nomenclatureToCases.get(nid).push(cid);
  }
  const caseToSphere = new Map();
  const sphereToCases = new Map();
  for(const e of data.sphere_case_edges){
    const sid = e.from.replace('sph-',''), cid = e.to.replace('case-','');
    if(!caseToSphere.has(cid)) caseToSphere.set(cid, []);
    caseToSphere.get(cid).push(sid);
    if(!sphereToCases.has(sid)) sphereToCases.set(sid, []);
    sphereToCases.get(sid).push(cid);
  }
  const avacaraToSpheres = new Map();
  const sphereToAvacara = new Map();
  for(const e of data.avacara_sphere_edges){
    const aid = e.from.replace('av-',''), sid = e.to.replace('sph-','');
    if(!avacaraToSpheres.has(aid)) avacaraToSpheres.set(aid, []);
    avacaraToSpheres.get(aid).push(sid);
    sphereToAvacara.set(sid, aid);
  }
  // Avacara reaches a case only through a sphere, so no avacara->case edge is
  // drawn. Composing the two hops reproduces the direct relation exactly (234
  // pairs either way -- both come from the same IV rows), and the map is
  // still wanted for the avacara tooltip and for highlighting on selection.
  const avacaraToCases = new Map();
  for(const [aid, sids] of avacaraToSpheres){
    const cases = sids.flatMap(sid => sphereToCases.get(sid) || []);
    avacaraToCases.set(aid, cases);
  }
  const qualDharmaToSpheres = new Map(); const sphereToQualDharma = new Map();
  for(const e of data.quality_dharma_sphere_edges){
    const qid = e.from.replace('qd-',''), sid = e.to.replace('sph-','');
    if(!qualDharmaToSpheres.has(qid)) qualDharmaToSpheres.set(qid, []);
    qualDharmaToSpheres.get(qid).push(sid);
    sphereToQualDharma.set(sid, qid);
  }

  function buildCaseAttrMaps(edges, fromPrefix){
    const itemToCases = new Map(), caseToItems = new Map();
    for(const e of edges){
      const iid = e.from.replace(fromPrefix,''), cid = e.to.replace('case-','');
      if(!itemToCases.has(iid)) itemToCases.set(iid, []);
      itemToCases.get(iid).push(cid);
      if(!caseToItems.has(cid)) caseToItems.set(cid, []);
      caseToItems.get(cid).push(iid);
    }
    return { itemToCases, caseToItems };
  }
  const { itemToCases: contentToCases, caseToItems: caseToContent } = buildCaseAttrMaps(data.content_case_edges, 'ct-');
  const { itemToCases: trancicToCases, caseToItems: caseToTrancic } = buildCaseAttrMaps(data.trancic_case_edges, 'tv-');
  const { itemToCases: mentalToCases, caseToItems: caseToMental } = buildCaseAttrMaps(data.mental_case_edges, 'mv-');
  const { itemToCases: senseObjToCases, caseToItems: caseToSenseObj } = buildCaseAttrMaps(data.sense_object_case_edges, 'so-');
  const { itemToCases: dhyanicObjToCases, caseToItems: caseToDhyanicObj } = buildCaseAttrMaps(data.dhyanic_object_case_edges, 'do-');
  const { caseToItems: caseToThought } = buildCaseAttrMaps(data.thought_case_edges, 'th-');
  const { caseToItems: caseToSphereThought } = buildCaseAttrMaps(data.sphere_thought_case_edges, 'st-');

  // ---------- SVG helpers ----------
  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }

  const edgeLayer = el('g', {id:'edges'}, viewport);
  const nodeLayer = el('g', {id:'nodes'}, viewport);

  // row labels
  function colLabel(x, y, text){
    el('text', {class:'row-label col-label', x, y:y-10, 'text-anchor':'middle'}, viewport).textContent = text;
  }
  colLabel((QD_X0+QD_X1)/2, Y_L1, 'CHARACTER OF DHARMAS (IV)');
  colLabel((AVACARA_X0+AVACARA_X1)/2, Y_L1, 'AVACARA (IV)');
  colLabel((SPHERE_X0+SPHERE_X1)/2, Y_SPHERE, 'SPHERE OF THOUGHT (IV)');
  colLabel((NOM_X0+NOM_X1)/2, Y_L2, 'NOMENCLATURE OF THOUGHT (III)');
  colLabel((CONTENT_X0+CONTENT_X1)/2, Y_L3, 'VARIANTS OF CONTENT (V-C)');
  colLabel((TRANCIC_X0+TRANCIC_X1)/2, Y_L3, 'TRANCIC VARIABLES (V-TV)');
  colLabel((SENSEOBJ_X0+SENSEOBJ_X1)/2, Y_L3, 'SENSE OBJECTS (V-O)');
  colLabel((DHYANICOBJ_X0+DHYANICOBJ_X1)/2, Y_L3, 'DHYĀNIC OBJECTS (V-O)');
  colLabel((MENTAL_X0+MENTAL_X1)/2, Y_L3, 'MENTAL VARIABLES (V-MV)');
  el('text', {class:'row-label', x:-10, y:Y_CASE+4, 'text-anchor':'end'}, viewport).textContent = 'CASES (V)';
  el('text', {class:'row-label', x:-10, y:Y_DHARMA+4, 'text-anchor':'end'}, viewport).textContent = 'DHARMAS Δ (VI)';
  el('text', {class:'row-label', x:-10, y:Y_MS+4, 'text-anchor':'end'}, viewport).textContent = 'MENTAL STATES (VI)';

  // ---------- edges ----------
  const edgeEls = {
    msDharma: [], dharmaCase: [], dharmaCaseVii: [],
    nomCase: [], sphereCase: [], avSphere: [],
    qdSphere: [],
    contentCase: [], trancicCase: [], mentalCase: [], senseObjCase: [], dhyanicObjCase: [],
    msDerivation: [], contentDerivation: [],
    dharmaHomonym: [], dharmaSynonym: [], dharmaIsotope: [], dharmaAsIn: [],
  };

  function curve(x1,y1,x2,y2){
    if(Math.abs(y1-y2) < 8){
      // same-row edge (e.g. avacara -> sphere): the usual vertical bezier
      // degenerates into a near-flat line here, and with many such edges
      // sharing a row they overlap into what looks like one continuous
      // horizontal line. Bow it into a visible arc instead.
      const midX = (x1+x2)/2;
      const dip = Math.max(30, Math.abs(x2-x1) * 0.08);
      const midY = y1 + dip;
      return `M${x1},${y1} Q${midX},${midY} ${x2},${y2}`;
    }
    const midY = (y1+y2)/2;
    return `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
  }

  // An "as in" dharma already carries its own dharma-MS edges (borrowed via
  // ms_range), so the pair already shares visible MS connections -- this arc
  // mostly just restates that, which is why it's off by default like the
  // other three dharma-relation checkboxes below.
  for(const e of data.dharma_as_in_edges){
    const dId = e.from.replace('dh-',''), tId = e.to.replace('dh-','');
    const dl = dharmaLayout.get(dId), tl = dharmaLayout.get(tId);
    if(!dl || !tl) continue;
    const p = el('path', {class:'edge dharma-as-in', d: curve(dl.x, Y_DHARMA, tl.x, Y_DHARMA)}, edgeLayer);
    edgeEls.dharmaAsIn.push({el:p, dharma:dId, other:tId});
  }

  // Homonym (XI, alpha), synonym (XII, beta) and isotope (XIII, gamma) groups:
  // unlike "as in", these dharmas share no other visible connection, so the
  // arc is the only place the relation shows up outside the popup text.
  // Each map is symmetric (a lists b and b lists a), so draw each pair once.
  function drawDharmaRelationEdges(byDharma, cssClass, bucket){
    for(const [id, others] of byDharma){
      const dl = dharmaLayout.get(id);
      if(!dl) continue;
      for(const otherId of others){
        if(cmpKey(sortKey(id), sortKey(otherId)) >= 0) continue;
        const ol = dharmaLayout.get(otherId);
        if(!ol) continue;
        const p = el('path', {class:'edge '+cssClass, d: curve(dl.x, Y_DHARMA, ol.x, Y_DHARMA)}, edgeLayer);
        edgeEls[bucket].push({el:p, dharma:id, other:otherId});
      }
    }
  }
  drawDharmaRelationEdges(homonymByDharma, 'dharma-homonym', 'dharmaHomonym');
  drawDharmaRelationEdges(synonymByDharma, 'dharma-synonym', 'dharmaSynonym');
  drawDharmaRelationEdges(isotopeByDharma, 'dharma-isotope', 'dharmaIsotope');

  // Off by default (see the base .edge.dharma-* display:none rule); each
  // checkbox reveals its own relation by adding 'shown' to its edges.
  function wireEdgeFilter(checkboxId, bucket){
    const cb = document.getElementById(checkboxId);
    cb.addEventListener('change', () => {
      for(const e of edgeEls[bucket]) e.el.classList.toggle('shown', cb.checked);
    });
  }
  wireEdgeFilter('toggleHomonym', 'dharmaHomonym');
  wireEdgeFilter('toggleSynonym', 'dharmaSynonym');
  wireEdgeFilter('toggleIsotope', 'dharmaIsotope');
  wireEdgeFilter('toggleAsIn', 'dharmaAsIn');

  for(const e of data.ms_derivation_edges){
    const pl = msLayout.get(e.from), cl = msLayout.get(e.to);
    if(!pl || !cl) continue;
    const p = el('path', {class:'edge ms-derivation', d: curve(pl.x, Y_MS, cl.x, Y_MS)}, edgeLayer);
    edgeEls.msDerivation.push({el:p, parent:e.from, child:e.to});
  }

  for(const e of data.content_derivation_edges){
    const parentId = e.from.replace('ct-',''), childId = e.to.replace('ct-','');
    const pl = contentX.get(parentId), cl = contentX.get(childId);
    if(!pl || !cl) continue;
    const p = el('path', {class:'edge content-derivation', d: curve(pl.x, pl.y, cl.x, cl.y)}, edgeLayer);
    edgeEls.contentDerivation.push({el:p, parent:parentId, child:childId});
  }

  for(const e of data.ms_edges){
    const dId = e.to.replace('dh-','');
    const ml = msLayout.get(e.from);
    const dl = dharmaLayout.get(dId);
    if(!ml || !dl) continue;
    const p = el('path', {class:'edge ms-dharma', d: curve(ml.x, Y_MS, dl.x, Y_DHARMA)}, edgeLayer);
    edgeEls.msDharma.push({el:p, ms:e.from, dharma:dId});
  }
  // No MS-to-dharmaset or MS-to-superset edges: both are sets of dharmas, so
  // an MS only reaches them through its dharma. See reachMs() above.
  for(const e of data.dharma_case_edges){
    const dId = e.from.replace('dh-',''), cId = e.to.replace('case-','');
    const dl = dharmaLayout.get(dId), cl = caseLayout.get(cId);
    if(!dl || !cl) continue;
    const p = el('path', {class:'edge dharma-case', d: curve(dl.x, Y_DHARMA, cl.x, Y_CASE)}, edgeLayer);
    edgeEls.dharmaCase.push({el:p, dharma:dId, case:cId});
  }
  for(const e of data.dharma_case_vii_edges){
    const dId = e.from.replace('dh-',''), cId = e.to.replace('case-','');
    const dl = dharmaLayout.get(dId), cl = caseLayout.get(cId);
    if(!dl || !cl) continue;
    const p = el('path', {class:'edge dharma-case-vii', d: curve(dl.x, Y_DHARMA, cl.x, Y_CASE)}, edgeLayer);
    edgeEls.dharmaCaseVii.push({el:p, dharma:dId, case:cId, superset:e.superset});
  }
  for(const e of data.nomenclature_case_edges){
    const nid = e.from.replace('nom-',''), cId = e.to.replace('case-','');
    const nl = nomenclatureX.get(nid), cl = caseLayout.get(cId);
    if(!nl || !cl) continue;
    const p = el('path', {class:'edge nom-case', d: curve(nl.x, nl.y, cl.x, Y_CASE)}, edgeLayer);
    edgeEls.nomCase.push({el:p, nom:nid, case:cId});
  }
  for(const e of data.sphere_case_edges){
    const sid = e.from.replace('sph-',''), cId = e.to.replace('case-','');
    const sl = sphereX.get(sid), cl = caseLayout.get(cId);
    if(!sl || !cl) continue;
    const p = el('path', {class:'edge sphere-case', d: curve(sl.x, sl.y, cl.x, Y_CASE)}, edgeLayer);
    edgeEls.sphereCase.push({el:p, sphere:sid, case:cId});
  }
  for(const e of data.avacara_sphere_edges){
    const aid = e.from.replace('av-',''), sid = e.to.replace('sph-','');
    const al = avacaraX.get(aid), sl = sphereX.get(sid);
    if(!al || !sl) continue;
    const p = el('path', {class:'edge av-sphere', d: curve(al.x, al.y, sl.x, sl.y)}, edgeLayer);
    edgeEls.avSphere.push({el:p, av:aid, sphere:sid});
  }
  for(const e of data.quality_dharma_sphere_edges){
    const qid = e.from.replace('qd-',''), sid = e.to.replace('sph-','');
    const ql = qualDharmaX.get(qid), sl = sphereX.get(sid);
    if(!ql || !sl) continue;
    const p = el('path', {class:'edge q-sphere', d: curve(ql.x, ql.y, sl.x, sl.y)}, edgeLayer);
    edgeEls.qdSphere.push({el:p, qd:qid, sphere:sid});
  }
  function drawCaseAttrEdges(edges, fromPrefix, xmap, cssClass, bucket, key){
    for(const e of edges){
      const iid = e.from.replace(fromPrefix,''), cId = e.to.replace('case-','');
      const xl = xmap.get(iid), cl = caseLayout.get(cId);
      if(!xl || !cl) continue;
      const p = el('path', {class:'edge '+cssClass, d: curve(xl.x, xl.y, cl.x, Y_CASE)}, edgeLayer);
      const rec = {el:p, case:cId}; rec[key] = iid;
      edgeEls[bucket].push(rec);
    }
  }
  drawCaseAttrEdges(data.content_case_edges, 'ct-', contentX, 'content-case', 'contentCase', 'content');
  drawCaseAttrEdges(data.trancic_case_edges, 'tv-', trancicX, 'caseattr-case', 'trancicCase', 'trancic');
  drawCaseAttrEdges(data.mental_case_edges, 'mv-', mentalX, 'caseattr-case', 'mentalCase', 'mental');
  drawCaseAttrEdges(data.sense_object_case_edges, 'so-', senseObjX, 'caseattr-case', 'senseObjCase', 'senseObj');
  drawCaseAttrEdges(data.dhyanic_object_case_edges, 'do-', dhyanicObjX, 'caseattr-case', 'dhyanicObjCase', 'dhyanicObj');

  // ---------- nodes ----------
  const qualityColor = {A:'var(--quality-a)', B:'var(--quality-b)', C:'var(--quality-c)'};
  const nodeEls = {
    case: new Map(), dharma: new Map(), ms: new Map(),
    nomenclature: new Map(), sphere: new Map(), avacara: new Map(),
    qualDharma: new Map(),

  // small-tier row nodes: dot + label above (rows share a Y, so labels

  makeRowNodes(data.nomenclature, 'term_id', nomenclatureX, 'T', 'node-nomenclature', 'nomenclature', 'nomenclature', 4.6);
  makeRowNodes(data.spheres, 'sphere_id', sphereX, 'S', 'node-sphere', 'sphere', 'sphere', 4.6);
  makeRowNodes(data.avacaras, 'key', avacaraX, '', 'node-avacara', 'avacara', 'avacara', 4.8);
  makeRowNodes(data.quality_dharma, 'letter', qualDharmaX, 'Ch:', 'node-qualtier', 'qualDharma', 'qualdharma', 4.2);
  makeRowNodes(data.content, 'content_id', contentX, 'C:', 'node-content', 'content', 'content', 3.6);
  makeRowNodes(data.trancic, 'trancic_id', trancicX, 'TV:', 'node-caseattr', 'trancic', 'trancic', 3.6);
  makeRowNodes(data.mental, 'mental_id', mentalX, 'MV:', 'node-caseattr', 'mental', 'mental', 3.6);
  makeRowNodes(data.sense_objects, 'object_id', senseObjX, 'O:', 'node-caseattr', 'senseObj', 'senseobj', 3.6);
  makeRowNodes(data.dhyanic_objects, 'object_id', dhyanicObjX, 'D:', 'node-caseattr', 'dhyanicObj', 'dhyanicobj', 3.6);

  // ---------- viewBox / pan / zoom ----------
  const fullBox = { x: -170, y: 0, w: totalWidth + 200, h: Y_MS + 60 };
  let vb = { ...fullBox };
  // Set by pinTooltip/unpinTooltip below; tracked here so applyViewBox can
  // keep a pinned popup glued to its node's screen position while the view
  // pans or zooms, instead of stranding it at the click coordinates.
  let pinned = false, pinnedType = null, pinnedId = null;
  // getBoundingClientRect() forces a layout flush; the stage only actually
  // moves/resizes on window resize or a sidebar toggle, so it's cached here
  // rather than re-read on every wheel/drag/tooltip-position event.
  let stageRect = stage.getBoundingClientRect();
  function refreshStageRect(){ stageRect = stage.getBoundingClientRect(); }
  function updatePinnedTooltipPosition(){
    if(!pinned || !pinnedType) return;
    const c = nodeCenter(pinnedType, pinnedId);
    if(!c) return;
    const rect = stageRect;
    const sx = rect.left + ((c.x-vb.x)/vb.w)*rect.width;
    const sy = rect.top + ((c.y-vb.y)/vb.h)*rect.height;
    tooltip.style.left = (sx+14)+'px';
    tooltip.style.top = (sy+14)+'px';
  }
  // Writing viewBox invalidates the raster of the whole diagram (~900 node
  // groups and ~3.6k edge paths), so it must happen at most once per frame.
  // Wheel and mousemove both fire faster than the display refresh, and every
  // extra write in the same frame is a full re-raster that is then thrown
  // away -- so callers only ever request a write, and the rAF callback
  // commits whatever vb ended up being.
  let vbRaf = null;
  function commitViewBox(){
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    updatePinnedTooltipPosition();
  }
  function applyViewBox(){
    if(vbRaf !== null) return;
    vbRaf = requestAnimationFrame(()=>{ vbRaf = null; commitViewBox(); });
  }
  // For the cases that must be on screen before the next paint (initial fit,
  // resize): skip the queue rather than showing a stale/unset viewBox.
  function flushViewBox(){
    if(vbRaf !== null){ cancelAnimationFrame(vbRaf); vbRaf = null; }
    commitViewBox();
  }
  function fitToStage(){
    refreshStageRect();
    const rect = stageRect;
    const aspect = rect.width / rect.height;
    let w = fullBox.w, h = fullBox.h;
    if(w/h > aspect){ h = w/aspect; } else { w = h*aspect; }
    vb = { x: fullBox.x - (w-fullBox.w)/2, y: fullBox.y - (h-fullBox.h)/2, w, h };
    flushViewBox();
  }
  fitToStage();
  window.addEventListener('resize', fitToStage);

  stage.addEventListener('wheel', (ev)=>{
    ev.preventDefault();
    const rect = stageRect;
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const px = vb.x + (mx/rect.width)*vb.w;
    const py = vb.y + (my/rect.height)*vb.h;
    const scale = Math.exp(ev.deltaY * 0.0016);
    const newW = Math.min(fullBox.w*3, Math.max(fullBox.w*0.02, vb.w*scale));
    const newH = newW * (vb.h/vb.w);
    vb = { x: px - (mx/rect.width)*newW, y: py - (my/rect.height)*newH, w:newW, h:newH };
    applyViewBox();
  }, {passive:false});

  // dragMoved distinguishes a pan from a plain click: mouseup after a drag
  // still fires a native click on the background, which would otherwise hit
  // the stage click handler below and clear the highlight mid-pan.
  // Both the main stage and the inline ER diagram drag against `window`
  // (so a drag continues even if the pointer leaves the source element);
  // registering through here keeps that as one pair of window listeners
  // instead of one per draggable surface.
  const dragMoveHandlers = [], dragEndHandlers = [];
  function onWindowDrag(onMove, onEnd){ dragMoveHandlers.push(onMove); dragEndHandlers.push(onEnd); }
  window.addEventListener('mousemove', ev => { for(const h of dragMoveHandlers) h(ev); });
  window.addEventListener('mouseup', ev => { for(const h of dragEndHandlers) h(ev); });

  let dragging = false, dragMoved = false, lastX=0, lastY=0;
  stage.addEventListener('mousedown', (ev)=>{
    if(ev.target.closest('.node')) return;
    refreshStageRect();
    dragging = true; dragMoved = false; lastX = ev.clientX; lastY = ev.clientY;
    stage.classList.add('grabbing');
  });
  onWindowDrag(ev => {
    if(!dragging) return;
    const rect = stageRect;
    const dx = (ev.clientX-lastX) * (vb.w/rect.width);
    const dy = (ev.clientY-lastY) * (vb.h/rect.height);
    if(Math.abs(ev.clientX-lastX) > 2 || Math.abs(ev.clientY-lastY) > 2) dragMoved = true;
    vb.x -= dx; vb.y -= dy;
    lastX = ev.clientX; lastY = ev.clientY;
    applyViewBox();
  }, () => { dragging=false; stage.classList.remove('grabbing'); });

  // Touch: one finger pans (mirrors mousedown/mousemove above), two fingers
  // pinch-zoom against the same vb the wheel handler drives. touch-action:none
  // on the SVG stops the browser's own page-zoom from fighting this -- without
  // it, mobile has no way to reach the wheel handler's zoom range at all and
  // is stuck with the browser's own, much shallower, pinch limit.
  let touchMode = null, pinchDist = 0, pinchVb = null;
  const touchPt = (t, rect) => ({ x: t.clientX-rect.left, y: t.clientY-rect.top });
  stage.addEventListener('touchstart', (ev)=>{
    if(ev.target.closest('.node')) return;
    refreshStageRect();
    const rect = stageRect;
    if(ev.touches.length === 1){
      touchMode = 'pan'; dragMoved = false;
      lastX = ev.touches[0].clientX; lastY = ev.touches[0].clientY;
    } else if(ev.touches.length === 2){
      touchMode = 'pinch'; dragMoved = true;
      const [a,b] = [...ev.touches].map(t=>touchPt(t,rect));
      pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
      pinchVb = { ...vb };
    }
  }, {passive:true});
  stage.addEventListener('touchmove', (ev)=>{
    if(!touchMode) return;
    ev.preventDefault();
    const rect = stageRect;
    if(touchMode === 'pan' && ev.touches.length === 1){
      const t = ev.touches[0];
      const dx = (t.clientX-lastX) * (vb.w/rect.width);
      const dy = (t.clientY-lastY) * (vb.h/rect.height);
      if(Math.abs(t.clientX-lastX) > 2 || Math.abs(t.clientY-lastY) > 2) dragMoved = true;
      vb.x -= dx; vb.y -= dy;
      lastX = t.clientX; lastY = t.clientY;
      applyViewBox();
    } else if(touchMode === 'pinch' && ev.touches.length === 2){
      const [a,b] = [...ev.touches].map(t=>touchPt(t,rect));
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const px = pinchVb.x + (mx/rect.width)*pinchVb.w;
      const py = pinchVb.y + (my/rect.height)*pinchVb.h;
      const scale = pinchDist / dist;
      const newW = Math.min(fullBox.w*3, Math.max(fullBox.w*0.02, pinchVb.w*scale));
      const newH = newW * (pinchVb.h/pinchVb.w);
      vb = { x: px-(mx/rect.width)*newW, y: py-(my/rect.height)*newH, w:newW, h:newH };
      applyViewBox();
    }
  }, {passive:false});
  stage.addEventListener('touchend', (ev)=>{
    if(ev.touches.length === 0) touchMode = null;
    else if(ev.touches.length === 1){
      touchMode = 'pan';
      lastX = ev.touches[0].clientX; lastY = ev.touches[0].clientY;
    }
  }, {passive:true});

  document.getElementById('zoomIn').onclick = ()=> zoomBtn(0.8);
  document.getElementById('zoomOut').onclick = ()=> zoomBtn(1.25);
  function zoomBtn(f){
    const cx = vb.x+vb.w/2, cy = vb.y+vb.h/2;
    const newW = vb.w*f, newH = vb.h*f;
    vb = { x: cx-newW/2, y: cy-newH/2, w:newW, h:newH };
    applyViewBox();
  }
  document.getElementById('soundToggle').onclick = (ev)=>{
    const btn = ev.currentTarget;
    btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') !== 'true');
  };

  // Chime played whenever V-O:2 (sound-objects) is involved, gated on
  // #soundToggle -- a little wink at that node's own gloss.
  let chimeCtx = null;
  function playChime(){
    const ctx = chimeCtx || (chimeCtx = new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state === 'suspended') ctx.resume();
    // Short, crisp tick similar to a laptop's volume-change blip: a brief
    // sine burst with a fast attack and fast decay, not a sustained tone.
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.35, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.1);
  }
  function maybeChime(type, id){
    const isVO2 = type==='senseobj' && String(id)==='2';
    const isCaseOfVO2 = type==='case' && (caseToSenseObj.get(String(id))||[]).includes('2');
    if(!isVO2 && !isCaseOfVO2) return;
    if(document.getElementById('soundToggle').getAttribute('aria-pressed')==='true') playChime();
  }

  const sidebar = document.getElementById('sidebar');
  document.getElementById('sidebarToggle').onclick = ()=>{
    sidebar.classList.toggle('collapsed');

    // moves with it, so its cached rect needs a refresh once settled.

  };

  // ---------- ER diagram (inline in sidebar) ----------
  // Same wheel/drag/pinch scheme as the main stage above, against the ER
  // SVG's own viewBox instead of the graph's.
  const erSvg = document.getElementById('erSvg');
  erSvg.innerHTML = erSvgMarkup;
  const erFullBox = { x:0, y:0, w:560, h:688 };
  let erVbState = { ...erFullBox };

    erSvg.setAttribute('viewBox', `${erVbState.x} ${erVbState.y} ${erVbState.w} ${erVbState.h}`);

  erSvg.addEventListener('wheel', (ev)=>{
    ev.preventDefault();

    const px = erVbState.x + (mx/rect.width)*erVbState.w;
    const py = erVbState.y + (my/rect.height)*erVbState.h;
    const scale = Math.exp(ev.deltaY * 0.0016);
    const newW = Math.min(erFullBox.w*3, Math.max(erFullBox.w*0.2, erVbState.w*scale));
    const newH = newW * (erVbState.h/erVbState.w);

    erApplyViewBox();
  }, {passive:false});

  let erDragging = false, erLastX = 0, erLastY = 0;
  erSvg.addEventListener('mousedown', (ev)=>{
    if(ev.target.closest('.er-node')) return;
    refreshErRect();
    erDragging = true; erLastX = ev.clientX; erLastY = ev.clientY;
    erSvg.classList.add('grabbing');
  });
  onWindowDrag(ev => {
    if(!erDragging) return;
    const rect = erRect;
    const dx = (ev.clientX-erLastX) * (erVbState.w/rect.width);
    const dy = (ev.clientY-erLastY) * (erVbState.h/rect.height);
    erVbState.x -= dx; erVbState.y -= dy;
    erLastX = ev.clientX; erLastY = ev.clientY;
    erApplyViewBox();
  }, () => { erDragging = false; erSvg.classList.remove('grabbing'); });

  let erTouchMode = null, erPinchDist = 0, erPinchVb = null;
  erSvg.addEventListener('touchstart', (ev)=>{
    if(ev.target.closest('.er-node')) return;
    refreshErRect();
    const rect = erRect;
    if(ev.touches.length === 1){
      erTouchMode = 'pan';
      erLastX = ev.touches[0].clientX; erLastY = ev.touches[0].clientY;
    } else if(ev.touches.length === 2){
      erTouchMode = 'pinch';
      const [a,b] = [...ev.touches].map(t=>({x:t.clientX-rect.left, y:t.clientY-rect.top}));
      erPinchDist = Math.hypot(a.x-b.x, a.y-b.y);

  }, {passive:true});
  erSvg.addEventListener('touchmove', (ev)=>{
    if(!erTouchMode) return;
    ev.preventDefault();

    if(erTouchMode === 'pan' && ev.touches.length === 1){
      const t = ev.touches[0];
      const dx = (t.clientX-erLastX) * (erVbState.w/rect.width);
      const dy = (t.clientY-erLastY) * (erVbState.h/rect.height);
      erVbState.x -= dx; erVbState.y -= dy;
      erLastX = t.clientX; erLastY = t.clientY;
      erApplyViewBox();
    } else if(erTouchMode === 'pinch' && ev.touches.length === 2){
      const [a,b] = [...ev.touches].map(t=>({x:t.clientX-rect.left, y:t.clientY-rect.top}));
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const px = erPinchVb.x + (mx/rect.width)*erPinchVb.w;
      const py = erPinchVb.y + (my/rect.height)*erPinchVb.h;
      const scale = erPinchDist / dist;
      const newW = Math.min(erFullBox.w*3, Math.max(erFullBox.w*0.2, erPinchVb.w*scale));
      const newH = newW * (erPinchVb.h/erPinchVb.w);
      erVbState = { x: px-(mx/rect.width)*newW, y: py-(my/rect.height)*newH, w:newW, h:newH };

    }
