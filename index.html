  erSvg.addEventListener('touchend', (ev)=>{
    if(ev.touches.length === 0) erTouchMode = null;
    else if(ev.touches.length === 1){
      erTouchMode = 'pan';
      erLastX = ev.touches[0].clientX; erLastY = ev.touches[0].clientY;
    }
  }, {passive:true});

  // ---------- ER diagram: click/tap a box to jump to its node group ----------
  // Nodes of a given type share a row (single Y for case/dharma/ms, a
  // near-constant Y for the smaller row types), so the bounding box of all
  // their <g transform="translate(x,y)"> centers is enough to frame the
  // whole group without hand-picking a Y per type.
  function boundsOfType(type){
    const map = nodeEls[type];
    if(!map || !map.size) return null;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for(const g of map.values()){
      const x = g._cx, y = g._cy;
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
    }
    return minX === Infinity ? null : {minX, maxX, minY, maxY};
  }
  function jumpToType(type){
    const b = boundsOfType(type);
    if(!b) return;
    panTo((b.minX+b.maxX)/2, (b.minY+b.maxY)/2, Math.max(b.maxX-b.minX+140, 140));
    for(const g of allNodeGroups) g.classList.remove('active');
    for(const e of allEdges) e.el.classList.remove('hl');
    dimAllExceptMap({ [type]: new Set(nodeEls[type].keys()) });
    // Collapse the sidebar so the jump is actually visible -- on a narrow
    // (mobile) screen it otherwise covers most of the canvas it just panned.
    sidebar.classList.add('collapsed');
  }
  erSvg.querySelectorAll('.er-node').forEach(node => {
    const type = node.getAttribute('data-type');
    node.addEventListener('click', () => jumpToType(type));
    node.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); jumpToType(type); }
    });
  });

  function panTo(x, y, w){
    const h = w * (fullBox.h/fullBox.w) * (stage.clientHeight/stage.clientWidth || 1);
    vb = { x: x-w/2, y: y-h/2, w, h };
    applyViewBox();
  }

  // ---------- highlighting ----------
  const TYPES = ['case','dharma','ms','nomenclature','sphere','avacara','qualDharma','content','trancic','mental','senseObj','dhyanicObj'];
  const allNodeGroups = TYPES.flatMap(t=>[...nodeEls[t].values()]);
  const allEdges = Object.values(edgeEls).flat();

  function clearHighlight(){
    for(const g of allNodeGroups){ g.classList.remove('dim'); g.classList.remove('active'); }
    for(const e of allEdges){ e.el.classList.remove('hl'); }
  }

  function dimAllExceptMap(activeMap){
    for(const t of TYPES){
      const active = activeMap[t] || new Set();
      for(const [id,g] of nodeEls[t]) g.classList.toggle('dim', !active.has(id));
    }
  }

  function setActive(type, id){
    for(const g of allNodeGroups) g.classList.remove('active');
    const map = nodeEls[type];
    if(map && map.get(id)) map.get(id).classList.add('active');
  }

  // ---------- distance-based selection ----------
  // One undirected adjacency list over typed keys ("type|id"), built from exactly
  // the relations the diagram draws. Clicking a node then means "show its direct
  // neighbours", so highlighting reads from this shared graph instead of a bespoke
  // set of neighbours written out in each handler -- which is how the VII
  // case-dharma edges came to be left unhighlighted when a dharma was clicked.
  const adj = new Map();
  const nkey = (t, id) => t + '|' + id;
  function nlink(t1, id1, t2, id2){
    const a = nkey(t1, id1), b = nkey(t2, id2);
    if(!adj.has(a)) adj.set(a, new Set());
    if(!adj.has(b)) adj.set(b, new Set());
    adj.get(a).add(b); adj.get(b).add(a);
  }
  // MS keys keep their "ms-" prefix, matching the node ids; the rest are bare.
  for(const e of data.ms_edges)                    nlink('ms', e.from, 'dharma', e.to.slice(3));
  for(const e of data.ms_derivation_edges)         nlink('ms', e.from, 'ms', e.to);
  for(const e of data.content_derivation_edges)    nlink('content', e.from.slice(3), 'content', e.to.slice(3));
  for(const e of data.dharma_as_in_edges)          nlink('dharma', e.from.slice(3), 'dharma', e.to.slice(3));
  for(const [id, others] of homonymByDharma)       for(const o of others) nlink('dharma', id, 'dharma', o);
  for(const [id, others] of synonymByDharma)       for(const o of others) nlink('dharma', id, 'dharma', o);
  for(const [id, others] of isotopeByDharma)       for(const o of others) nlink('dharma', id, 'dharma', o);
  for(const e of data.dharma_case_edges)           nlink('dharma', e.from.slice(3), 'case', e.to.slice(5));
  for(const e of data.dharma_case_vii_edges)       nlink('dharma', e.from.slice(3), 'case', e.to.slice(5));
  for(const e of data.nomenclature_case_edges)     nlink('nomenclature', e.from.slice(4), 'case', e.to.slice(5));
  for(const e of data.sphere_case_edges)           nlink('sphere', e.from.slice(4), 'case', e.to.slice(5));
  for(const e of data.avacara_sphere_edges)        nlink('avacara', e.from.slice(3), 'sphere', e.to.slice(4));
  for(const e of data.quality_dharma_sphere_edges) nlink('qualDharma', e.from.slice(3), 'sphere', e.to.slice(4));
  for(const [arr, t] of [[data.content_case_edges, 'content'],
                         [data.trancic_case_edges, 'trancic'],
                         [data.mental_case_edges, 'mental'],
                         [data.sense_object_case_edges, 'senseObj'],
                         [data.dhyanic_object_case_edges, 'dhyanicObj']]){
    for(const e of arr) nlink(t, e.from.slice(3), 'case', e.to.slice(5));
  }

  // Which row each type sits on, used by the popup's up/down cross-nav below.
  const ROW = {
    avacara: 1, qualDharma: 1,
    sphere: 2, nomenclature: 2,
    content: 3, trancic: 3, mental: 3, senseObj: 3, dhyanicObj: 3,
    case: 4, dharma: 5, ms: 6,
  };

  // A click reaches only what it touches directly -- one step out, no further.
  function reachFrom(type, id){
    const start = nkey(type, id);
    const dist = new Map([[start, 0]]);
    for(const n of (adj.get(start) || [])) dist.set(n, 1);
    const byType = {};
    for(const k of dist.keys()){
      const i = k.indexOf('|'), t = k.slice(0, i);
      if(!byType[t]) byType[t] = new Set();
      byType[t].add(k.slice(i + 1));
    }
    return { nodes: byType, dist };
  }

  // An edge lights up only when it crosses a distance layer -- its ends must be
  // exactly one step apart. Requiring merely that both ends were reached lights
  // edges that lead nowhere from the clicked node: clicking Δ15 reaches case 1
  // and Δ19 (via "as in"), both one step out, and would then also light the
  // case-1-to-Δ19 edge, which is not on any path out of Δ15.
  function applyHighlightFromActive(reach){
    const at = (t, id) => reach.dist.get(nkey(t, id));
    const pair = (t1, i1, t2, i2) => {
      const a = at(t1, i1), b = at(t2, i2);
      return a !== undefined && b !== undefined && Math.abs(a - b) === 1;
    };
    for(const e of edgeEls.msDharma)       e.el.classList.toggle('hl', pair('ms', e.ms, 'dharma', e.dharma));
    for(const e of edgeEls.msDerivation)   e.el.classList.toggle('hl', pair('ms', e.parent, 'ms', e.child));
    for(const e of edgeEls.contentDerivation) e.el.classList.toggle('hl', pair('content', e.parent, 'content', e.child));
    for(const e of edgeEls.dharmaCase)     e.el.classList.toggle('hl', pair('dharma', e.dharma, 'case', e.case));
    for(const e of edgeEls.dharmaCaseVii)  e.el.classList.toggle('hl', pair('dharma', e.dharma, 'case', e.case));
    for(const e of edgeEls.nomCase)        e.el.classList.toggle('hl', pair('nomenclature', e.nom, 'case', e.case));
    for(const e of edgeEls.sphereCase)     e.el.classList.toggle('hl', pair('sphere', e.sphere, 'case', e.case));
    for(const e of edgeEls.avSphere)       e.el.classList.toggle('hl', pair('avacara', e.av, 'sphere', e.sphere));
    for(const e of edgeEls.qdSphere)       e.el.classList.toggle('hl', pair('qualDharma', e.qd, 'sphere', e.sphere));
    for(const e of edgeEls.contentCase)    e.el.classList.toggle('hl', pair('content', e.content, 'case', e.case));
    for(const e of edgeEls.trancicCase)    e.el.classList.toggle('hl', pair('trancic', e.trancic, 'case', e.case));
    for(const e of edgeEls.mentalCase)     e.el.classList.toggle('hl', pair('mental', e.mental, 'case', e.case));
    for(const e of edgeEls.senseObjCase)   e.el.classList.toggle('hl', pair('senseObj', e.senseObj, 'case', e.case));
    for(const e of edgeEls.dhyanicObjCase) e.el.classList.toggle('hl', pair('dhyanicObj', e.dhyanicObj, 'case', e.case));
    for(const e of edgeEls.dharmaHomonym)  e.el.classList.toggle('hl', pair('dharma', e.dharma, 'dharma', e.other));
    for(const e of edgeEls.dharmaSynonym)  e.el.classList.toggle('hl', pair('dharma', e.dharma, 'dharma', e.other));
    for(const e of edgeEls.dharmaIsotope)  e.el.classList.toggle('hl', pair('dharma', e.dharma, 'dharma', e.other));
    for(const e of edgeEls.dharmaAsIn)     e.el.classList.toggle('hl', pair('dharma', e.dharma, 'dharma', e.other));
  }

  function select(type, id){
    const reach = reachFrom(type, id);
    dimAllExceptMap(reach.nodes);
    setActive(type, id);
    applyHighlightFromActive(reach);
    return reach;
  }

  function selectCase(cId){
    select('case', cId);
    describe(`Case ${cId}: ${(caseToDharmas.get(cId)||[]).length} newly-introduced dharma(s) in VI, `
      + `${(caseToNomenclature.get(cId)||[]).length} nomenclature term(s), ${(caseToSphere.get(cId)||[]).length} sphere(s).`);
  }

  function selectDharma(dId){
    select('dharma', dId);
    const d = dharmaById.get(dId);
    describe(`Δ${dId} ${d.name_pali} (${d.name_translation||''}) — quality ${d.quality}, introduced at case ${d.owner_case}.`);
  }

  function selectMs(msId){
    select('ms', msId);
    const m = msById.get(msId);
    describe(`MS ${m.no} ${m.pali} — '${m.translation}'.`);
  }

  function selectNomenclature(nid){
    select('nomenclature', nid);
    const n = nomenclatureById.get(nid);
    describe(`Nomenclature T${nid} — ${n.term_pali} (${n.translation}).`);
  }

  function selectSphere(sid){
    select('sphere', sid);
    const s = sphereById.get(sid);
    describe(`Sphere S${sid} — ${s.sphere_pali} (${s.translation}).`);
  }

  function selectAvacara(aid){
    select('avacara', aid);
    const a = avacaraById.get(aid);
    describe(`Avacara ${aid} — ${a.gloss}.`);
  }

  const caseAttrToCasesMaps = { content: contentToCases, trancic: trancicToCases, mental: mentalToCases, senseObj: senseObjToCases, dhyanicObj: dhyanicObjToCases };
  const caseAttrByIdMaps = { content: contentById, trancic: trancicById, mental: mentalById, senseObj: senseObjById, dhyanicObj: dhyanicObjById };
  const caseAttrLabels = { content: 'Variant of content', trancic: 'Trancic variable', mental: 'Mental variable', senseObj: 'Sense object', dhyanicObj: 'Dhyānic object' };
  function selectCaseAttr(typeKey, id){
    select(typeKey, id);
    const cases = caseAttrToCasesMaps[typeKey].get(id) || [];
    const item = caseAttrByIdMaps[typeKey].get(id);
    const desc = item ? (item.pali ? `${item.pali} (${item.translation||''})` : (item.translation||'')) : '';
    describe(`${caseAttrLabels[typeKey]} ${id} — ${desc} — ${cases.length} case(s).`);
  }

  const qualToSpheresMaps = { qualDharma: qualDharmaToSpheres };
  const qualByIdMaps = { qualDharma: qualDharmaById };
  const qualLabels = { qualDharma: 'Character of dharmas' };
  function selectQuality(typeKey, letter){
    select(typeKey, letter);
    const spheres = qualToSpheresMaps[typeKey].get(letter) || [];
    const g = qualByIdMaps[typeKey].get(letter);
    describe(`${qualLabels[typeKey]} ${letter} (${g?g.gloss:''}) — ${spheres.length} sphere(s).`);
  }

  function describe(){ /* bottom status line removed */ }

  function selectByType(type, id){
    maybeChime(type, id);
    if(type==='case') selectCase(id);
    else if(type==='dharma') selectDharma(id);
    else if(type==='ms') selectMs(id);
    else if(type==='nomenclature') selectNomenclature(id);
    else if(type==='sphere') selectSphere(id);
    else if(type==='avacara') selectAvacara(id);
    else if(type==='qualdharma') selectQuality('qualDharma', id);
    else if(type==='content') selectCaseAttr('content', id);
    else if(type==='trancic') selectCaseAttr('trancic', id);
    else if(type==='mental') selectCaseAttr('mental', id);
    else if(type==='senseobj') selectCaseAttr('senseObj', id);
    else if(type==='dhyanicobj') selectCaseAttr('dhyanicObj', id);
  }

  // data-type strings (as read off the DOM / written into ttLink) to the
  // camelCase keys nodeEls/select() actually use -- they only differ for the
  // three multi-word entities.
  const NODE_TYPE_KEY = {
    case:'case', dharma:'dharma', ms:'ms', nomenclature:'nomenclature',
    sphere:'sphere', avacara:'avacara', qualdharma:'qualDharma',
    content:'content', trancic:'trancic', mental:'mental',
    senseobj:'senseObj', dhyanicobj:'dhyanicObj',
  };
  function nodeCenter(type, id){
    const map = nodeEls[NODE_TYPE_KEY[type]];
    const g = map && map.get(id);
    return g ? {x:g._cx, y:g._cy} : null;
  }

  // The reverse of NODE_TYPE_KEY: nodeEls/adj/ROW key -> DOM data-type string.
  const DATA_TYPE_OF = Object.fromEntries(Object.entries(NODE_TYPE_KEY).map(([k,v]) => [v,k]));

  // ---------- popup cross-nav: up/down/left/right to a neighbouring node ----------
  // Left/right walk along the same type's own row, ordered by x position.
  // Up/down follow the adjacency graph (the same one clicking a node uses to
  // highlight its neighbours) to a connected node one row up or down, picking
  // whichever candidate sits closest in x when more than one qualifies.
  // Node x-positions are fixed once the diagram is built, so each type's
  // sorted id list is computed once and cached rather than re-sorted on
  // every navCrossHtml() call (every tooltip open/nav) and dirBtn click.
  const typeIdsSortedByXCache = new Map();
  function typeIdsSortedByX(type){
    if(typeIdsSortedByXCache.has(type)) return typeIdsSortedByXCache.get(type);
    const camelType = NODE_TYPE_KEY[type];
    const ids = [...nodeEls[camelType].keys()]
      .map(id => ({id, c: nodeCenter(type, id)}))
      .filter(o => o.c)
      .sort((a,b) => a.c.x - b.c.x)
      .map(o => o.id);
    typeIdsSortedByXCache.set(type, ids);
    return ids;
  }
  function neighborLeftRight(type, id, dir){
    const ids = typeIdsSortedByX(type);
    const i = ids.indexOf(id);
    if(i < 0) return null;
    const j = dir === 'left' ? i-1 : i+1;
    return j >= 0 && j < ids.length ? {type, id: ids[j]} : null;
  }
  function neighborUpDown(type, id, dir){
    const camelType = NODE_TYPE_KEY[type];
    const myRow = ROW[camelType];
    const neighbors = adj.get(nkey(camelType, id));
    if(!neighbors) return null;
    const candidates = [];
    for(const key of neighbors){
      const i = key.indexOf('|');
      const nCamelType = key.slice(0, i), nId = key.slice(i+1);
      const nRow = ROW[nCamelType];
      if(nRow === undefined) continue;
      if(dir === 'up' ? nRow >= myRow : nRow <= myRow) continue;
      candidates.push({type: DATA_TYPE_OF[nCamelType], id: nId});
    }
    if(!candidates.length) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }
  function neighborFor(type, id, dir){
    return (dir === 'left' || dir === 'right')
      ? neighborLeftRight(type, id, dir)
      : neighborUpDown(type, id, dir);
  }
  const DIR_ARROW = {up:'&#9650;', left:'&#9664;', right:'&#9654;', down:'&#9660;'};
  function navCrossHtml(type, id){
    return '<div class="tt-nav">' + ['left','right'].map(dir => {
      const has = !!neighborFor(type, id, dir);
      return `<button class="tt-dir" data-dir="${dir}"${has ? '' : ' disabled'} aria-label="${dir}" title="${dir}">${DIR_ARROW[dir]}</button>`;
    }).join('') + '</div>';
  }

  // Used by tooltip links to jump to and click the node they name, then
  // re-pin the tooltip over the node's new screen position.
  function navigateAndPin(type, id){
    selectByType(type, id);
    const c = nodeCenter(type, id);
    if(!c){ pinTooltip(type, id, window.innerWidth/2, window.innerHeight/2); return; }
    vb = { x: c.x-vb.w/2, y: c.y-vb.h/2, w: vb.w, h: vb.h };
    applyViewBox();
    const rect = stageRect;
    const sx = rect.left + ((c.x-vb.x)/vb.w)*rect.width;
    const sy = rect.top + ((c.y-vb.y)/vb.h)*rect.height;
    pinTooltip(type, id, sx+14, sy+14);
  }

  nodeLayer.addEventListener('click', (ev)=>{
    const g = ev.target.closest('.node');
    if(!g) return;
    const type = g.getAttribute('data-type');
    const id = g.getAttribute('data-id');
    selectByType(type, id);
    pinTooltip(type, id, ev.clientX+14, ev.clientY+14);
  });

  stage.addEventListener('click', (ev)=>{
    if(dragMoved){ dragMoved = false; return; }
    if(ev.target.closest('#tooltip')){
      if(ev.target.closest('.tt-close')){ unpinTooltip(); return; }
      const dirBtn = ev.target.closest('.tt-dir');
      if(dirBtn){
        if(dirBtn.disabled) return;
        const dir = dirBtn.getAttribute('data-dir');
        const n = neighborFor(pinnedType, pinnedId, dir);
        if(n) navigateAndPin(n.type, n.id);
        return;
      }
      const link = ev.target.closest('.tt-link');
      if(link) navigateAndPin(link.getAttribute('data-type'), link.getAttribute('data-id'));
      return;
    }
    if(!ev.target.closest('.node')){ clearHighlight(); describe(''); unpinTooltip(); }
  });

  // Left/right arrow keys drive the same same-row neighbour nav as the
  // tooltip's own <-/-> buttons. Skipped while typing in an input (the
  // search box) so the keys keep their normal cursor-movement meaning there.
  document.addEventListener('keydown', (ev)=>{
    if(!pinnedType) return;
    if(ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    const dir = ev.key === 'ArrowLeft' ? 'left' : 'right';
    const n = neighborFor(pinnedType, pinnedId, dir);
    if(n){ ev.preventDefault(); navigateAndPin(n.type, n.id); }
  });

  // ---------- tooltip ----------
  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Wraps a popup value in a clickable span so lists inside a pinned tooltip
  // can jump straight to the node they name (e.g. a homonym Δ, a VII set's
  // source case) without closing the popup and hunting for it on the canvas.
  function ttLink(type, id, html){
    return `<span class="tt-link" data-type="${esc(type)}" data-id="${esc(id)}">${html}</span>`;
  }

  function tooltipFor(type, id){
    if(type==='case'){
      const c = caseById.get(id);
      const nomIds = caseToNomenclature.get(id) || [];
      const sphIds = caseToSphere.get(id) || [];
      const thoughtIds = caseToThought.get(id) || [];
      const sphThoughtIds = caseToSphereThought.get(id) || [];
      const charDharmaLetter = sphIds.map(sid=>sphereById.get(sid)).find(s=>s&&s.char_dharma)?.char_dharma;
      let rows = '';
      if(thoughtIds.length){
        rows += `<br><span class="muted">V-NT</span> ` + thoughtIds.map(tid=>{
          const t = thoughtById.get(tid);
          return t ? `${esc(t.pali)}${t.translation ? ` (${esc(t.translation)})` : ''}` : `NT${esc(tid)}`;
        }).join(', ');
      }
      if(sphThoughtIds.length){
        rows += `<br><span class="muted">V-ST</span> ` + sphThoughtIds.map(sid=>{
          const s = sphereThoughtById.get(sid);
          return s ? `${esc(s.pali)} (${esc(s.translation)})` : `ST${esc(sid)}`;
        }).join(', ');
      }
      if(!c.stub && Array.isArray(c.content_ids) && c.content_ids.length){
        const parts = c.content_ids.map(cidRaw=>{
          const cd = contentDefs[cidRaw];
          if(!cd) return esc(cidRaw);
          const star = contentFootnoteSet.has(id+'|'+cidRaw) ? '*' : '';
          return ttLink('content', cidRaw, `${esc(cidRaw)}${star} ${esc(cd.pali)} &mdash; '${esc(cd.translation)}'`);
        });
        rows += `<br><span class="muted">V-C</span> ` + parts.join('; ');
      }
      if(!c.stub){
        const trIds = caseToTrancic.get(id) || [];
        if(trIds.length){
          rows += `<br><span class="muted">V-TV</span> ` + trIds.map(t=>{ const tv=trancicById.get(t); return tv? ttLink('trancic', t, `${esc(t)} ${esc(tv.pali)} (${esc(tv.translation)})`) : 'TV'+esc(t); }).join(', ');
        }
        const objIds = caseToSenseObj.get(id) || [];
        const dhyIds = caseToDhyanicObj.get(id) || [];
        if(objIds.length || dhyIds.length){
          const objParts = objIds.map(o=>{ const so=senseObjById.get(o); return so? ttLink('senseobj', o, `${esc(o)} ${esc(so.translation)}`) : 'O'+esc(o); });
          const dhyParts = dhyIds.map(o=>{ const d=dhyanicObjById.get(o); return d? ttLink('dhyanicobj', o, `[${esc(o)}] ${esc(d.pali)} (${esc(d.translation)})`) : 'D'+esc(o); });
          rows += `<br><span class="muted">V-O</span> ` + [...objParts, ...dhyParts].join(', ');
        }
        const mentIds = caseToMental.get(id) || [];
        if(mentIds.length){
          rows += `<br><span class="muted">V-MV</span> ` + mentIds.map(m=>{ const mv=mentalById.get(m); return mv? ttLink('mental', m, `${esc(m)} ${esc(mv.pali)} (${esc(mv.translation)})`) : 'MV'+esc(m); }).join(', ');
        }
      } else {
        rows += `<br><span class="muted">not present in V</span>`;
      }
      if(nomIds.length){
        rows += `<br><span class="muted">III</span> ` + nomIds.map(nid=>{
          const n = nomenclatureById.get(nid);
          return n ? ttLink('nomenclature', nid, `${esc(n.term_pali)} (${esc(n.translation)})`) : `T${esc(nid)}`;
        }).join(', ');
      }
      if(sphIds.length){
        rows += `<br><span class="muted">IV</span> ` + sphIds.map(sid=>{
          const s = sphereById.get(sid);
          return s ? ttLink('sphere', sid, `${esc(s.sphere_pali)} (${esc(s.translation)})`) : `S${esc(sid)}`;
        }).join(', ') + (charDharmaLetter ? ` (${esc(charDharmaLetter)})` : '');
      }
      if(c.paragraph || c.pages){
        const rangeNote = c.paragraph_case_range ? ` <span class="muted">(shared with cases ${esc(c.paragraph_case_range)})</span>` : '';
        rows += `<br><span class="muted">VIII</span> &sect;${esc(c.paragraph)}, p.${esc(c.pages)}${rangeNote}`;
      }
      return `<b>Case ${esc(c.case_id)}</b>${rows}`;
    }
    if(type==='dharma'){
      const d = dharmaById.get(id);
      const supersets = dharmaToSupersets.get(id) || [];
      const qd = qualDharmaById.get(d.quality);
      const glossMatch = qd && /'([^']+)'/.exec(qd.gloss);
      const glossTxt = glossMatch ? glossMatch[1] : '';
      const dLink = t => ttLink('dharma', t, '&Delta;'+esc(t));
      const supersetLinks = supersets.sort().map(sId=>{
        const s = supersetById.get(sId);
        return s ? ttLink('case', s.case_num, esc(sId)) : esc(sId);
      });
      return `<b>Dharma VI:&Delta;${esc(d.dharma_id)}</b> &mdash; ${esc(d.name_pali)}<br><span class="muted">${esc(d.name_translation)}</span>`
        + `<br><span class="muted">VI</span> ${ttLink('qualdharma', d.quality, esc(d.quality))}${glossTxt? `(${esc(glossTxt)})` : ''}, case ${ttLink('case', d.owner_case, esc(d.owner_case))}`
        + (d.xref? ' &middot; cross-ref, shares MS range' : '')
        + ((d.as_in||[]).length? `<br><span class="muted">as in</span> ${d.as_in.map(dLink).join(', ')}` : '')
        + ((dharmaToMs.get(id)||[]).length? `<br><span class="muted">VI-MS</span> ${dharmaToMs.get(id).map(mId=>{ const m=msById.get(mId); return m? ttLink('ms', mId, `MS ${esc(m.no)}`) : esc(mId); }).join(', ')}` : '')
        + `<br><span class="muted">VII</span>: ${supersetLinks.length? supersetLinks.join(', ') : '&mdash;'}`
        + ((homonymByDharma.get(id)||[]).length? `<br><span class="muted">homonyms (XI, &alpha;)</span> ${homonymByDharma.get(id).map(dLink).join(', ')}` : '')
        + ((synonymByDharma.get(id)||[]).length? `<br><span class="muted">synonyms (XII, &beta;)</span> ${synonymByDharma.get(id).map(dLink).join(', ')}` : '')
        + ((isotopeByDharma.get(id)||[]).length? `<br><span class="muted">isotops (XIII, &gamma;)</span> ${isotopeByDharma.get(id).map(dLink).join(', ')}` : '')
        + (xivByDharma.has(id)? `<br><span class="muted">XIV</span> ${xivSign(xivByDharma.get(id).x)} ${xivSign(xivByDharma.get(id).y)}` : '');
    }
    if(type==='ms'){
      const m = msById.get(id);
      const dharmas = msToDharmas.get(id) || [];
      const supersets = msToSupersets.get(id) || [];
      const parent = m.derived_from != null ? msById.get('ms-' + m.derived_from) : null;
      const kids = (msDerivedFrom.get(m.no) || []);
      const supersetLinks = supersets.sort().map(sId=>{
        const s = supersetById.get(sId);
        return s ? ttLink('case', s.case_num, esc(sId)) : esc(sId);
      });
      return `<b>MS ${esc(m.no)}</b> ${esc(m.pali)}<br><span class="muted">&lsquo;${esc(m.translation)}&rsquo;</span>`
        + (parent? `<br><span class="muted">derived from</span> ${ttLink('ms', parent.id, `MS ${esc(parent.no)} ${esc(parent.pali)} &lsquo;${esc(parent.translation)}&rsquo;`)}` : '')
        + (kids.length? `<br><span class="muted">derivative(s)</span> ${kids.map(k=>ttLink('ms', k.id, `MS ${esc(k.no)} ${esc(k.pali)}`)).join(', ')}` : '')
        + `<br><span class="muted">VI</span> dharma(s): ${dharmas.map(d=>ttLink('dharma', d, '&Delta;'+esc(d))).join(', ')}`
        + `<br><span class="muted">VII</span> in sets: ${supersetLinks.length? supersetLinks.join(', ') : '&mdash;'}`;
    }
    if(type==='nomenclature'){
      const n = nomenclatureById.get(id);
      return `<b>Nomenclature III:${esc(id)}</b> ${esc(n.term_pali)}<br><span class="muted">${esc(n.translation)}</span>`;
    }
    if(type==='sphere'){
      const s = sphereById.get(id);
      return `<b>Sphere of Thought IV:${esc(id)}</b> ${esc(s.sphere_pali)}<br><span class="muted">${esc(s.translation)}</span>`
        + `<br><span class="muted">IV</span> avacara ${ttLink('avacara', s.avacara, esc(s.avacara))}${s.avacara_inferred?' &dagger;':''} &middot; character of dharmas ${ttLink('qualdharma', s.char_dharma, esc(s.char_dharma))}`;
    }
    if(type==='avacara'){
      const a = avacaraById.get(id);
      return `<b>${esc(id)}</b><br><span class="muted">${esc(a.gloss)}</span>`;
    }
    if(type==='qualdharma'){
      const cfg = [qualDharmaById, qualDharmaToSpheres, 'Character of dharmas IV:'];
      const [byId, , label] = cfg;
      const g = byId.get(id);
      return `<b>${esc(label)}${esc(id)}</b><br><span class="muted">${esc(g?g.gloss:'')}</span>`;
    }
    if(type==='content' || type==='trancic' || type==='mental' || type==='senseobj' || type==='dhyanicobj'){
      const cfg = {
        content:[contentById,contentToCases,'Variant of content V-C:'],
        trancic:[trancicById,trancicToCases,'Trancic variable V-TV:'],
        mental:[mentalById,mentalToCases,'Mental variable V-MV:'],
        senseobj:[senseObjById,senseObjToCases,'Sense object V-O:'],
        dhyanicobj:[dhyanicObjById,dhyanicObjToCases,'Dhyānic object V-O:'],
      }[type];
      const [byId, toCases, label] = cfg;
      const item = byId.get(id);
      const nameLine = item ? (item.pali ? `${esc(item.pali)}<br><span class="muted">${esc(item.translation||'')}</span>` : esc(item.translation||'')) : '';
      const parentLine = (item && item.parent_id) ? `<br><span class="muted">&#8594;</span> ${ttLink('content', item.parent_id, esc(item.parent_id))}` : '';
      return `<b>${esc(label)}${esc(id)}</b><br>${nameLine}${parentLine}`;
    }
    return '';
  }
  // A click pins the tooltip open (with a close button) until it is
  // explicitly closed or the user clicks away; until then hover no longer
  // moves or overwrites it.
  function pinTooltip(type, id, x, y){
    pinned = true;
    pinnedType = type;
    pinnedId = id;
    tooltip.innerHTML = tooltipFor(type, id) + navCrossHtml(type, id) + '<span class="tt-close" title="Close">&times;</span>';
    tooltip.classList.add('pinned');
    tooltip.style.left = x+'px';
    tooltip.style.top = y+'px';
    tooltip.style.display = 'block';
  }
  function unpinTooltip(){
    if(!pinned) return;
    pinned = false;
    pinnedType = null;
    pinnedId = null;
    tooltip.classList.remove('pinned');
    tooltip.style.display = 'none';
  }
  let hoveredKey = null;
  nodeLayer.addEventListener('mousemove', (ev)=>{
    if(pinned) return;
    const g = ev.target.closest('.node');
    if(!g){ hoveredKey = null; tooltip.style.display='none'; return; }
    const type = g.getAttribute('data-type'), id = g.getAttribute('data-id');
    const key = type+'|'+id;
    if(key !== hoveredKey){
      hoveredKey = key;
      tooltip.innerHTML = tooltipFor(type, id);
    }
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX+14)+'px';
    tooltip.style.top = (ev.clientY+14)+'px';
  });
  nodeLayer.addEventListener('mouseleave', ()=>{ hoveredKey = null; if(!pinned) tooltip.style.display='none'; });

  // ---------- search ----------
  const searchInput = document.getElementById('search');
  function runSearch(){
    const q = searchInput.value.trim().toLowerCase();
    if(!q) return;
    if(caseById.has(q)){
      selectCase(q);
      const l = caseLayout.get(q);
      panTo(l.x, Y_CASE, Math.max(600, l.width*3));
      return;
    }
    const nomMatch = /^t(\d+)$/i.exec(q);
    if(nomMatch && nomenclatureById.has(nomMatch[1])){
      selectNomenclature(nomMatch[1]);
      const nl = nomenclatureX.get(nomMatch[1]);
      panTo(nl.x, nl.y, 500);
      return;
    }
    const sphMatch = /^s(\d+)$/i.exec(q);
    if(sphMatch && sphereById.has(sphMatch[1])){
      selectSphere(sphMatch[1]);
      const sl = sphereX.get(sphMatch[1]);
      panTo(sl.x, sl.y, 500);
      return;
    }
    for(const d of data.dharmas){
      if(d.dharma_id.toLowerCase()===q || (d.name_pali||'').toLowerCase().includes(q) || (d.name_translation||'').toLowerCase().includes(q)){
        selectDharma(d.dharma_id);
        const l = dharmaLayout.get(d.dharma_id);
        panTo(l.x, Y_DHARMA, 500);
        return;
      }
    }
    for(const n of data.nomenclature){
      if((n.term_pali||'').toLowerCase().includes(q) || (n.translation||'').toLowerCase().includes(q)){
        selectNomenclature(n.term_id);
        const nl = nomenclatureX.get(n.term_id);
        panTo(nl.x, nl.y, 500);
        return;
      }
    }
    for(const s of data.spheres){
      if((s.sphere_pali||'').toLowerCase().includes(q) || (s.translation||'').toLowerCase().includes(q)){
        selectSphere(s.sphere_id);
        const sl = sphereX.get(s.sphere_id);
        panTo(sl.x, sl.y, 500);
        return;
      }
    }
    const caseAttrSearchTargets = [
      [data.content, 'content_id', contentX, 'content'],
      [data.trancic, 'trancic_id', trancicX, 'trancic'],
      [data.mental, 'mental_id', mentalX, 'mental'],
      [data.sense_objects, 'object_id', senseObjX, 'senseObj'],
      [data.dhyanic_objects, 'object_id', dhyanicObjX, 'dhyanicObj'],
    ];
    for(const [list, idKey, xmap, typeKey] of caseAttrSearchTargets){
      for(const item of list){
        if((item.pali||'').toLowerCase().includes(q) || (item.translation||'').toLowerCase().includes(q)){
          selectCaseAttr(typeKey, item[idKey]);
          const pl = xmap.get(item[idKey]);
          panTo(pl.x, pl.y, 500);
          return;
        }
      }
    }
    describe(`No match for "${q}".`);
  }
  searchInput.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter') runSearch(); });
  document.getElementById('searchBtn').addEventListener('click', runSearch);

  // ---------- initial focus: Case 1 preselected, popup open ----------
  // Zoomed so the on-screen gap between the CASES and MS rows (two
  // LAYER_GAP apart in diagram units) comes out a bit smaller than the
  // popup's own rendered height -- measured live rather than hard-coded,
  // since popup height depends on Case 1's actual content. Centered
  // between CASES and MS so the MS row is visible on load too.
  (function initialFocus(){
    const l = caseLayout.get('1');
    if(!l) return;
    selectByType('case', '1');
    const cx = l.x, cy = (Y_CASE + Y_MS) / 2;
    pinTooltip('case', '1', -9999, -9999);
    const popupH = tooltip.getBoundingClientRect().height || 200;
    refreshStageRect();
    const rect = stageRect;
    const aspect = rect.width / rect.height;
    const h = (2*LAYER_GAP / (popupH * 0.9)) * rect.height;
    const w = h * aspect;
    vb = { x: cx - w/2, y: cy - h/2, w, h };
    flushViewBox();
    const sx = rect.left + ((l.x-vb.x)/vb.w)*rect.width;
    const sy = rect.top + ((Y_CASE-vb.y)/vb.h)*rect.height;
    pinTooltip('case', '1', sx+14, sy+14);
  })();

})();
</script>
